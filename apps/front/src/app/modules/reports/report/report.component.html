<div class="mx-5 h-full min-w-0 py-5">
  <ag-grid-angular
    class="ag-theme-alpine block h-full max-h-full w-full max-w-full"
    [class.invisible]="!isGridFitReady"
    [style.--report-grid-scrollbar-size.px]="gridScrollbarSize"
    [style.width.px]="gridWidth"
    [style.height.px]="gridHeight"
    [scrollbarWidth]="gridScrollbarSize"
    [theme]="gridTheme"
    [rowClass]="rowCssClasses"
    [headerHeight]="40"
    [overlayNoRowsTemplate]="overlayNoRowsTemplate"
    [columnDefs]="columnDefs"
    [getRowId]="getRowId"
    [defaultColDef]="defaultColDef"
    [columnTypes]="columnTypes"
    [rowDragManaged]="true"
    [suppressColumnVirtualisation]="false"
    [rowDragMultiRow]="true"
    [suppressCellFocus]="true"
    [animateRows]="false"
    [rowSelection]="rowSelection"
    [getRowHeight]="getRowHeight.bind(this)"
    (rowClicked)="onRowClicked($event)"
    (selectionChanged)="onSelectionChanged($event)"
    (rangeSelectionChanged)="onRangeSelectionChanged($event)"
    (gridReady)="onGridReady($event)"
    (displayedColumnsChanged)="scheduleGridFit()"
    (modelUpdated)="scheduleGridFit()"
    (columnResized)="onColumnResized($event)"
    (rowDragEnd)="rowDragEndHandle($event)"
  ></ag-grid-angular>
</div>

<div *ngIf="report$ | async"></div>
