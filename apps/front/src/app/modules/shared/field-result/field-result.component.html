<div
  *ngIf="isEmpty !== true"
  class="flex flex-shrink-0 items-center justify-center"
  [ngClass]="{
    'mt-[2px]':
      size === 2 &&
      (!result ||
        result === 'string' ||
        result === 'day_of_week' ||
        result === 'day_of_week_index' ||
        result === 'month_name' ||
        result === 'quarter_of_year' ||
        (!!result && allResultValues.indexOf(result) < 0)),
    'mb-[2px]':
      size === 3 &&
      (!result ||
        result === 'string' ||
        result === 'day_of_week' ||
        result === 'day_of_week_index' ||
        result === 'month_name' ||
        result === 'quarter_of_year' ||
        (!!result && allResultValues.indexOf(result) < 0)),
    'text-g1': fieldClass === 'measure' || fieldClass === 'calculation',
    'text-m600': fieldClass === 'dimension',
    'text-s500': !fieldClass || fieldClass === 'filter'
  }"
  tp="{{
    result === 'day_of_week' ||
    result === 'day_of_week_index' ||
    result === 'month_name' ||
    result === 'quarter_of_year'
      ? 'Enum: ' + result
      : !!result && allResultValues.indexOf(result) < 0
        ? 'Custom: ' + result
        : !!result
          ? result
          : 'Filter'
  }}"
>
  <m-type-number-icon
    *ngIf="result === 'number'"
    [size]="size"
  ></m-type-number-icon>

  <m-type-string-icon
    *ngIf="result === 'string'"
    [size]="size"
  ></m-type-string-icon>

  <m-type-on-off-icon
    *ngIf="['yesno', 'boolean'].indexOf(result) > -1"
    [size]="size"
  ></m-type-on-off-icon>

  <m-type-date-icon
    *ngIf="['ts', 'date'].indexOf(result) > -1"
    [size]="size"
  ></m-type-date-icon>

  <m-type-enum-icon
    *ngIf="
      result === 'day_of_week' ||
      result === 'day_of_week_index' ||
      result === 'month_name' ||
      result === 'quarter_of_year'
    "
    [size]="size"
  ></m-type-enum-icon>

  <m-type-custom-icon
    *ngIf="!!result && allResultValues.indexOf(result) < 0"
    [size]="size"
  ></m-type-custom-icon>

  <m-type-filter-icon *ngIf="!result" [size]="size"></m-type-filter-icon>
</div>
