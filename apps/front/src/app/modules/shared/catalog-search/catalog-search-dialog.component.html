<div
  class="flex max-h-[var(--catalog-search-max-height)] flex-col p-[var(--search-popup-padding)] text-sm"
  cdkTrapFocus
  [cdkTrapFocusAutoCapture]="true"
  (keydown)="
    moveFocus({ event: $event, input: searchInput, resultTree: searchResults })
  "
>
  <form
    class="flex flex-shrink-0 items-center gap-[8px]"
    role="search"
    (ngSubmit)="apply()"
  >
    <input
      #searchInput
      cdkFocusInitial
      [attr.data-cy]="ref.data.inputTestId"
      type="search"
      class="search-popup-input form-input min-w-0 flex-1"
      spellcheck="false"
      autocomplete="off"
      [placeholder]="'Search ' + ref.data.label"
      [attr.aria-label]="'Search ' + ref.data.label"
      [value]="word"
      (input)="updatePreview({ word: searchInput.value })"
    />

    <button
      type="submit"
      class="bg-m600 text-m0 enabled:hover:bg-m500 h-11 flex-shrink-0 rounded-md px-3 text-sm font-medium disabled:cursor-default disabled:opacity-50"
      [disabled]="!canSearch"
      >Apply</button
    >
  </form>

  <div
    #searchResults
    class="mt-[8px] min-h-0 overflow-y-auto"
    [class.hidden]="rows.length === 0"
    role="tree"
    [attr.aria-label]="'Matching ' + ref.data.label"
  >
    @for (
      row of rows;
      track row.node.kind + ':' + row.node.id;
      let i = $index
    ) {
      <button
        type="button"
        role="treeitem"
        class="rail-item min-w-0 text-sm"
        [class.py-1]="row.fieldLabelParts.length > 0"
        [attr.tabindex]="i === activeIndex ? 0 : -1"
        [attr.aria-level]="row.level"
        [attr.aria-expanded]="
          row.node.kind === 'folder'
            ? !collapsedFolderIdSet.has(row.node.id)
            : null
        "
        [style.padding-left.rem]="0.5 + (row.level - 1) * 0.75"
        (focus)="activeIndex = i"
        (click)="activeIndex = i; activateRow({ row: row })"
      >
        @if (row.node.kind === 'folder' || row.level > 1) {
          <span
            class="text-s500 flex w-10 flex-shrink-0 items-center gap-1"
            aria-hidden="true"
          >
            @if (row.node.kind === 'folder') {
              @if (collapsedFolderIdSet.has(row.node.id)) {
                <m-chevron-right-icon></m-chevron-right-icon>
                <m-folder-closed-icon class="text-m500"></m-folder-closed-icon>
              } @else {
                <m-chevron-down-icon></m-chevron-down-icon>
                <m-folder-open-icon class="text-m600"></m-folder-open-icon>
              }
            }
          </span>
        }

        <span class="min-w-0">
          <span class="block truncate">
            @for (part of row.labelParts; track $index) {
              <span [class.font-semibold]="part.isMatch">{{ part.text }}</span>
            }
          </span>
          @for (parts of row.fieldLabelParts; track $index) {
            <span class="block truncate pl-4">
              <span class="text-s500 mr-2" aria-hidden="true">›</span>
              @for (part of parts; track $index) {
                <span [class.font-semibold]="part.isMatch">{{
                  part.text
                }}</span>
              }
            </span>
          }
        </span>
      </button>
    }
  </div>

  @if (canSearch && rows.length === 0) {
    <div
      class="text-s500 mt-[8px] px-[var(--rail-item-padding-inline)] py-[6px]"
      role="status"
      >No matching {{ ref.data.label.toLowerCase() }}</div
    >
  }
</div>
