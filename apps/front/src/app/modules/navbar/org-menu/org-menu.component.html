<div class="rail-children">
  <button
    type="button"
    class="rail-item"
    [attr.aria-current]="lastUrl === pathAccount ? 'page' : null"
    [disabled]="needSave || lastUrl === pathAccount"
    (click)="navigateAccount()"
    >Account</button
  >

  <div
    tp="Only organization owner can access"
    placement="right"
    [tpIsEnabled]="user?.userId !== nav?.orgOwnerId"
  >
    <button
      type="button"
      class="rail-item"
      [attr.aria-current]="lastUrl === pathUsers ? 'page' : null"
      [disabled]="
        needSave || lastUrl === pathUsers || user?.userId !== nav?.orgOwnerId
      "
      (click)="navigateUsers()"
      >Users</button
    >
  </div>
</div>

<div *ngIf="nav$ | async"></div>
<div *ngIf="routerEvents$ | async"></div>
<div *ngIf="needSave$ | async"></div>
<div *ngIf="user$ | async"></div>
