<div class="rail-children">
  <button
    type="button"
    class="rail-item"
    [attr.aria-current]="lastUrl === pathInfo ? 'page' : null"
    [disabled]="needSave || lastUrl === pathInfo"
    (click)="navigateInfo()"
    >Project Info</button
  >

  <div
    tp="Admin or Editor role required"
    placement="right"
    [tpIsEnabled]="isAdmin === false && isEditor === false"
  >
    <button
      type="button"
      class="rail-item"
      [attr.aria-current]="lastUrl === pathProviders ? 'page' : null"
      [disabled]="
        needSave ||
        lastUrl === pathProviders ||
        (isAdmin === false && isEditor === false)
      "
      (click)="navigateProviders()"
      >LLM Providers</button
    >
  </div>

  <button
    type="button"
    class="rail-item"
    [attr.aria-current]="lastUrl === pathSandboxProvider ? 'page' : null"
    [disabled]="needSave || lastUrl === pathSandboxProvider"
    (click)="navigateSandboxProvider()"
    >Sandbox Provider</button
  >

  <div
    tp="Admin or Editor role required"
    placement="right"
    [tpIsEnabled]="isAdmin === false && isEditor === false"
  >
    <button
      type="button"
      class="rail-item"
      [attr.aria-current]="lastUrl === pathConnections ? 'page' : null"
      [disabled]="
        needSave ||
        lastUrl === pathConnections ||
        (isAdmin === false && isEditor === false)
      "
      (click)="navigateConnections()"
      >Connections</button
    >
  </div>

  <div
    tp="Admin or Editor role required"
    placement="right"
    [tpIsEnabled]="isAdmin === false && isEditor === false"
  >
    <button
      type="button"
      class="rail-item"
      [attr.aria-current]="lastUrl === pathEnvironments ? 'page' : null"
      [disabled]="
        needSave ||
        lastUrl === pathEnvironments ||
        (isAdmin === false && isEditor === false)
      "
      (click)="navigateEnvironments()"
      >Environments</button
    >
  </div>

  <div
    tp="Project is restricted for demo purposes. Only admin can access."
    placement="right"
    [tpIsEnabled]="nav?.orgName === demoOrgName && isAdmin === false"
  >
    <button
      type="button"
      class="rail-item"
      [attr.aria-current]="lastUrl === pathTeam ? 'page' : null"
      [disabled]="
        needSave ||
        lastUrl === pathTeam ||
        (nav?.orgName === demoOrgName && isAdmin === false)
      "
      (click)="navigateTeam()"
      >Team</button
    >
  </div>

  <div
    tp="Admin or Editor role required"
    placement="right"
    [tpIsEnabled]="isAdmin === false && isEditor === false"
  >
    <button
      type="button"
      class="rail-item"
      [attr.aria-current]="lastUrl === pathRoles ? 'page' : null"
      [disabled]="
        needSave ||
        lastUrl === pathRoles ||
        (isAdmin === false && isEditor === false)
      "
      (click)="navigateRoles()"
      >Access Roles</button
    >
  </div>

  <div
    tp="Admin or Editor role required"
    placement="right"
    [tpIsEnabled]="isAdmin === false && isEditor === false"
  >
    <button
      type="button"
      class="rail-item"
      [attr.aria-current]="lastUrl === pathGivens ? 'page' : null"
      [disabled]="
        needSave ||
        lastUrl === pathGivens ||
        (isAdmin === false && isEditor === false)
      "
      (click)="navigateGivens()"
      >Project Givens</button
    >
  </div>

  <button
    type="button"
    class="rail-item"
    [disabled]="needSave"
    (click)="showSelectedGivens()"
    >Selected Givens</button
  >
</div>

<div *ngIf="nav$ | async"></div>
<div *ngIf="routerEvents$ | async"></div>
<div *ngIf="needSave$ | async"></div>
<div *ngIf="alias$ | async"></div>
<div *ngIf="isAdmin$ | async"></div>
<div *ngIf="isEditor$ | async"></div>
