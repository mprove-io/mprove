<nav aria-label="Account">
  <button
    type="button"
    class="rail-item"
    [attr.aria-current]="lastUrl === pathProfile ? 'page' : null"
    [disabled]="needSave === true || lastUrl === pathProfile"
    (click)="navigateProfile()"
    >Profile</button
  >

  <button
    *ngIf="isMproveAdmin"
    type="button"
    class="rail-item"
    [attr.aria-current]="lastUrl === pathServerUsers ? 'page' : null"
    [disabled]="needSave === true || lastUrl === pathServerUsers"
    (click)="navigateServerUsers()"
    >Server Users</button
  >

  <button
    type="button"
    class="rail-item mt-4"
    [disabled]="needSave === true"
    (click)="logout()"
    >Log Out</button
  >

  <div class="mt-4 flex items-baseline justify-between">
    <div class="rail-label select-none">Version: {{ mproveVersion }}</div>
    <a
      class="rail-label shrink-0 hover:underline"
      target="_blank"
      rel="noopener"
      href="https://docs.mprove.io"
      >Docs</a
    >
  </div>
</nav>

<div *ngIf="routerEvents$ | async"></div>
<div *ngIf="needSave$ | async"></div>
<div *ngIf="mproveVersion$ | async"></div>
<div *ngIf="isMproveAdmin$ | async"></div>
