@let popupPositions = isSideMenu ? sidePopupPositions : topPopupPositions;
@let isWorkspacePage =
  isBuilderRouteActive ||
  isExplorerRouteActive ||
  isReportsRouteActive ||
  isModelsRouteActive ||
  isDashboardsRouteActive;

<div class="mprove-shell grid h-full w-full" [class.side-menu]="isSideMenu">
  <header
    class="rail top-nav"
    [class.side-menu-no-divider]="isSideMenu && isWorkspacePage"
  >
    <button
      type="button"
      class="flex flex-none cursor-pointer items-center rounded"
      [attr.aria-label]="isSideMenu ? 'Show top navigation' : 'Show left menu'"
      aria-controls="mprove-navigation"
      (click)="isSideMenu = !isSideMenu"
    >
      <img
        class="h-11 w-[6.75rem] select-none object-contain [--mprove-spacing-scale:initial]"
        src="assets/logo/mprove_logo_web-01-b.svg"
        alt="Mprove"
      />
    </button>

    <div id="mprove-navigation" class="top-nav-content" cdkScrollable>
      <div class="top-nav-main" *ngIf="!!nav?.projectId">
        <section class="rail-branch-slot" aria-label="Branch">
          <m-branch-select class="rail-picker"></m-branch-select>
        </section>

        <nav class="top-nav-pages" aria-label="Pages">
          <button
            type="button"
            class="rail-item"
            [attr.aria-current]="isBuilderRouteActive ? 'page' : null"
            (click)="navigateBuilder()"
            [disabled]="needSave"
          >
            <span data-page-label="Builder">Builder</span>
            <span *ngIf="nav.needValidate === true" class="rail-status"
              >Validation needed</span
            >
            <span
              *ngIf="
                nav.needValidate === false &&
                (struct?.errors.length > 0 || repo?.conflicts.length > 0)
              "
              class="rail-status"
              >Issues</span
            >
          </button>

          <div
            *ngIf="explorerEnabled"
            tp="Explorer role required"
            [tpPlacement]="isSideMenu ? 'right' : 'bottom'"
            [tpIsEnabled]="member?.isExplorer === false"
          >
            <button
              type="button"
              class="rail-item"
              [attr.aria-current]="isExplorerRouteActive ? 'page' : null"
              (click)="navigateExplorer()"
              [disabled]="needSave || member?.isExplorer !== true"
            >
              <span data-page-label="Explorer">Explorer</span>
            </button>
          </div>

          <div
            tp="Explorer role required"
            [tpPlacement]="isSideMenu ? 'right' : 'bottom'"
            [tpIsEnabled]="member?.isExplorer === false"
          >
            <button
              type="button"
              class="rail-item"
              [attr.aria-current]="isModelsRouteActive ? 'page' : null"
              (click)="navigateCharts()"
              [disabled]="needSave || member?.isExplorer !== true"
            >
              <span data-page-label="Charts">Charts</span>
            </button>
          </div>

          <button
            type="button"
            class="rail-item"
            [attr.aria-current]="isReportsRouteActive ? 'page' : null"
            (click)="navigateReports()"
            [disabled]="needSave"
          >
            <span data-page-label="Reports">Reports</span>
          </button>

          <button
            type="button"
            class="rail-item"
            [attr.aria-current]="isDashboardsRouteActive ? 'page' : null"
            (click)="navigateDashboards()"
            [disabled]="needSave"
          >
            <span data-page-label="Dashboards">Dashboards</span>
          </button>
        </nav>
      </div>

      <div class="top-nav-context">
        <m-org-menu [popupPositions]="popupPositions"></m-org-menu>
        <m-project-menu [popupPositions]="popupPositions"></m-project-menu>

        <section
          *ngIf="!!nav?.projectId"
          class="rail-picker"
          aria-label="Environment"
        >
          <m-env-select></m-env-select>
        </section>

        <m-user-menu [popupPositions]="popupPositions"></m-user-menu>
      </div>
    </div>
  </header>

  <div
    class="isolate min-h-0 min-w-0 overflow-auto"
    [class.workspace-page-inset]="isWorkspacePage"
  >
    <router-outlet></router-outlet>
  </div>
</div>

<div *ngIf="nav$ | async"></div>
<div *ngIf="repo$ | async"></div>
<div *ngIf="session$ | async"></div>
<div *ngIf="struct$ | async"></div>
<div *ngIf="member$ | async"></div>
<div *ngIf="needSave$ | async"></div>
<div *ngIf="routerEvents$ | async"></div>
