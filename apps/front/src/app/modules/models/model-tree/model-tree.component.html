<div class="flex w-full flex-col">
  <div
    *ngIf="!model?.modelId"
    class="flex h-full w-full flex-1 flex-col items-center justify-center"
  >
    <div class="flex text-lg"> Select Model</div>
  </div>

  <div
    *ngIf="!!model?.modelId"
    class="flex h-2 flex-grow flex-col overflow-y-auto"
  >
    <ng-scrollbar
      [orientation]="'vertical'"
      [visibility]="'hover'"
      [appearance]="'compact'"
    >
      <div class="h-[16px]"></div>

      <div
        *ngIf="
          nodesExtra?.length > 0 &&
          (modelTreeLevels === 'FlatTime' || modelTreeLevels === 'Flat')
        "
      >
        <div *ngFor="let node of nodesExtra">
          <div
            class="group-bar flex h-11 w-full flex-row"
            [ngClass]="{
              'pl-6 pr-5':
                node.nodeClass === 'dimension' ||
                node.nodeClass === 'measure' ||
                node.nodeClass === 'calculation' ||
                node.nodeClass === 'filter'
            }"
            tp="A required field cannot be deselected"
            [tpIsEnabled]="
              node.required === true &&
              node.isSelected === true &&
              selectableFieldClasses.includes(node.nodeClass)
            "
          >
            <div
              data-cy="modelTreeItem"
              class="bg-m0 flex w-full select-none flex-row rounded"
              [ngClass]="{
                'pl-3': node.isField === false,
                'cursor-pointer':
                  (!node.isField && node.children?.length > 0) ||
                  (node.required === false &&
                    selectableFieldClasses.includes(node.nodeClass))
              }"
              (click)="flatNodeOnClick(node)"
            >
              <div
                class="relative flex w-full flex-row items-center rounded"
                [ngClass]="{
                  'mr-5 pl-3': node.isField === false,
                  'pr-3': node.isField === true,
                  'bg-m50':
                    node.isSelected === true &&
                    node.required === false &&
                    expandableFieldClasses.includes(node.nodeClass),
                  'hover:bg-m50':
                    node.required === false &&
                    expandableFieldClasses.includes(node.nodeClass)
                }"
              >
                <div class="flex min-w-[2px] flex-row items-center">
                  <div
                    *ngIf="!node.isField && node.nodeClass !== 'info'"
                    class="flex flex-row items-center space-x-1"
                  >
                    <div
                      class="flex items-center"
                      [ngClass]="{
                        'ml-3':
                          node.nodeClass === 'dimension' &&
                          node.isField === false
                      }"
                    >
                      <!-- <m-chevron-right-icon
                        *ngIf="!node.isExpanded && node.children?.length > 0"
                      ></m-chevron-right-icon>

                      <m-chevron-down-icon
                        *ngIf="node.isExpanded && node.children?.length > 0"
                      ></m-chevron-down-icon> -->
                    </div>
                  </div>

                  <div
                    *ngIf="node.isField === true"
                    class="mr-3 flex h-2 items-center"
                    [ngClass]="{
                      'ml-[10px]': !(node.children?.length > 0)
                    }"
                  >
                    <div
                      *ngIf="
                        node.isSelected === true && node.nodeClass !== 'filter'
                      "
                      data-cy="modelTreeSelectedSymbol"
                      class="h-[10px] w-[10px] rounded-full focus:outline-none"
                      [ngClass]="{
                        'bg-m600':
                          node.nodeClass === 'measure' ||
                          node.nodeClass === 'calculation' ||
                          node.nodeClass === 'dimension'
                      }"
                    ></div>

                    <div
                      *ngIf="
                        node.isSelected === false || node.nodeClass === 'filter'
                      "
                      class="h-[10px] w-[10px]"
                    ></div>
                  </div>

                  <div
                    *ngIf="node.isField === true"
                    class="ml-1 flex h-6 w-6 flex-shrink-0 items-center justify-center"
                  >
                    <m-field-result
                      [fieldClass]="node.nodeClass"
                      [result]="node.fieldResult"
                      [size]="2"
                    ></m-field-result>
                  </div>

                  <div
                    class="text-s1 flex-grow truncate"
                    [ngClass]="{
                      'ml-3': node.isField === true
                    }"
                  >
                    <span
                      class="truncate"
                      *ngIf="node.nodeClass === 'info'"
                      class="text-s500 font-semibold"
                    >
                      {{ node.label | uppercase }}
                    </span>

                    <span
                      class="truncate text-base"
                      *ngIf="node.nodeClass !== 'info'"
                      [ngClass]="{
                        'ml-3':
                          (node.children?.length > 0 &&
                            node.nodeClass !== 'dimension' &&
                            (modelTreeLevels === 'FlatTime' ||
                              modelTreeLevels === 'Flat')) ||
                          (node.children?.length > 0 &&
                            node.nodeClass === 'dimension')
                      }"
                    >
                      {{ node.joinLabel | capitalize }}
                    </span>

                    <span
                      class="truncate text-base font-semibold"
                      *ngIf="
                        node.nodeClass !== 'info' && model.type !== 'Malloy'
                      "
                    >
                      {{ node.timeLabel | capitalize }}
                    </span>

                    <span
                      class="truncate text-base font-semibold"
                      *ngIf="node.nodeClass !== 'info'"
                      [ngClass]="{
                        'font-semibold':
                          node.children.length === 0 ||
                          node.nodeClass === 'dimension',
                        'ml-3':
                          node.children?.length > 0 &&
                          node.nodeClass !== 'dimension',
                        'ml-2':
                          node.children?.length > 0 &&
                          node.nodeClass === 'dimension' &&
                          modelTreeLevels !== 'Flat'
                      }"
                    >
                      {{ node.label | capitalize }}
                    </span>
                  </div>
                </div>

                <div class="flex flex-grow"></div>

                <!-- <div
                class="ml-3 flex flex-row items-center"
                tp="A required filter cannot be removed"
                [tpIsEnabled]="
                  node.required === true &&
                  node.isFiltered === true &&
                  node.nodeClass === nodeClassFilter
                "
              >
                <button
                  *ngIf="node.isField === true"
                  type="button"
                  data-cy="filesTreeFilterButton"
                  class="group invisible flex h-10 flex-shrink-0 items-center justify-center rounded focus:outline-none [.group-bar:hover_&]:visible"
                  [ngClass]="{
                    'text-m600': node.isFiltered === true,
                    'text-s1': node.isFiltered === false
                  }"
                  [disabled]="
                    node.required === true &&
                    node.isFiltered === true &&
                    node.nodeClass === nodeClassFilter
                  "
                  (click)="filterField(node, $event)"
                >
                  <div
                    class="flex h-8 w-9 flex-shrink-0 flex-row items-center justify-center rounded"
                    [ngClass]="{
                      'group-hover:bg-m200':
                        node.required === false ||
                        node.isFiltered === false ||
                        node.nodeClass !== nodeClassFilter
                    }"
                  >
                    <m-filter-icon
                      [ngClass]="{
                        visible: node.isFiltered === true
                      }"
                    ></m-filter-icon>
                  </div>
                </button>
              </div> -->

                <div
                  *ngIf="node.isField === true"
                  class="invisible ml-3 flex [.group-bar:hover_&]:visible"
                >
                  <m-field-options
                    [modelNodeData]="node"
                    [isMetric]="false"
                  ></m-field-options>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <tree-root
        *ngIf="
          nodesExtra?.length > 0 &&
          modelTreeLevels !== 'FlatTime' &&
          modelTreeLevels !== 'Flat'
        "
        class="h-2 w-full"
        #itemsTree
        [nodes]="nodesExtra"
        [options]="treeOptions"
        (initialized)="treeOnInitialized()"
        (updateData)="treeOnUpdateData()"
      >
        <ng-template #treeNodeTemplate let-node="node">
          <div
            class="group-bar flex h-11 w-full flex-row"
            [ngClass]="{
              'pl-6 pr-5':
                node.data.nodeClass === fieldClassDimension ||
                node.data.nodeClass === fieldClassMeasure ||
                node.data.nodeClass === fieldClassCalculation ||
                node.data.nodeClass === fieldClassFilter
            }"
            tp="A required field cannot be deselected"
            [tpIsEnabled]="
              node.data.required === true &&
              node.data.isSelected === true &&
              selectableFieldClasses.includes(node.data.nodeClass)
            "
          >
            <div
              data-cy="modelTreeItem"
              class="bg-m0 flex w-full select-none flex-row rounded"
              [ngClass]="{
                'pl-3': node.data.isField === false,
                'cursor-pointer':
                  (!node.data.isField && node.hasChildren) ||
                  (node.data.required === false &&
                    selectableFieldClasses.includes(node.data.nodeClass))
              }"
              (click)="nestedNodeOnClick(node)"
            >
              <div
                class="relative flex w-full flex-row items-center rounded"
                [ngClass]="{
                  'mr-5 pl-3': node.data.isField === false,
                  'pr-3': node.data.isField === true,
                  'bg-m50':
                    node.data.isSelected === true &&
                    node.data.required === false &&
                    expandableFieldClasses.includes(node.data.nodeClass),
                  'hover:bg-m50':
                    node.data.required === false &&
                    expandableFieldClasses.includes(node.data.nodeClass)
                }"
              >
                <div class="flex min-w-[2px] flex-row items-center">
                  <div
                    *ngIf="
                      !node.data.isField &&
                      node.data.nodeClass !== fieldClassInfo
                    "
                    class="flex flex-row items-center space-x-1"
                  >
                    <div
                      class="flex items-center"
                      [ngClass]="{
                        'ml-3':
                          node.data.nodeClass === fieldClassDimension &&
                          node.data.isField === false
                      }"
                    >
                      <m-chevron-right-icon
                        *ngIf="!node.isExpanded && node.hasChildren"
                      ></m-chevron-right-icon>

                      <m-chevron-down-icon
                        *ngIf="node.isExpanded && node.hasChildren"
                      ></m-chevron-down-icon>
                    </div>
                  </div>

                  <div
                    *ngIf="node.data.isField === true"
                    class="mr-3 flex h-2 items-center"
                    [ngClass]="{
                      'ml-[10px]':
                        !node.hasChildren &&
                        node.parent?.data.nodeClass !== fieldClassDimension,
                      'ml-[44px]':
                        node.parent?.data.nodeClass === fieldClassDimension
                    }"
                  >
                    <div
                      *ngIf="
                        node.data.isSelected === true &&
                        node.data.nodeClass !== fieldClassFilter
                      "
                      data-cy="modelTreeSelectedSymbol"
                      class="h-[10px] w-[10px] rounded-full focus:outline-none"
                      [ngClass]="{
                        'bg-m600':
                          node.data.nodeClass === fieldClassMeasure ||
                          node.data.nodeClass === fieldClassCalculation ||
                          node.data.nodeClass === fieldClassDimension
                      }"
                    ></div>

                    <div
                      *ngIf="
                        node.data.isSelected === false ||
                        node.data.nodeClass === fieldClassFilter
                      "
                      class="h-[10px] w-[10px]"
                    ></div>
                  </div>

                  <div
                    *ngIf="node.data.isField === true"
                    class="ml-1 flex h-6 w-6 flex-shrink-0 items-center justify-center"
                  >
                    <m-field-result
                      [fieldClass]="node.data.nodeClass"
                      [result]="node.data.fieldResult"
                      [size]="2"
                    ></m-field-result>
                  </div>

                  <div
                    class="text-s1 flex-grow truncate"
                    [ngClass]="{
                      'ml-3': node.data.isField === true
                    }"
                  >
                    <span
                      class="truncate"
                      *ngIf="node.data.nodeClass === fieldClassInfo"
                      class="text-s500 font-semibold"
                    >
                      {{ node.data.label | uppercase }}
                    </span>

                    <span
                      class="truncate text-base"
                      *ngIf="node.data.nodeClass !== fieldClassInfo"
                      [ngClass]="{
                        'ml-3':
                          node.hasChildren &&
                          node.data.nodeClass === fieldClassDimension
                      }"
                    >
                      {{ node.data.joinLabel | capitalize }}
                    </span>

                    <span
                      class="truncate text-base font-semibold"
                      *ngIf="
                        node.data.nodeClass !== fieldClassInfo &&
                        model.type !== 'Malloy'
                      "
                    >
                      {{ node.data.timeLabel | capitalize }}
                    </span>

                    <span
                      class="truncate text-base font-semibold"
                      *ngIf="node.data.nodeClass !== fieldClassInfo"
                      [ngClass]="{
                        'font-semibold':
                          node.data.children.length === 0 ||
                          node.data.nodeClass === fieldClassDimension,
                        'ml-3':
                          node.hasChildren &&
                          node.data.nodeClass !== fieldClassDimension,
                        'ml-2':
                          node.hasChildren &&
                          node.data.nodeClass === fieldClassDimension &&
                          modelTreeLevels !== 'Nested'
                      }"
                    >
                      {{ node.data.label | capitalize }}
                    </span>
                  </div>
                </div>

                <div class="flex flex-grow"></div>

                <!-- <div
                class="ml-3 flex flex-row items-center"
                tp="A required filter cannot be removed"
                [tpIsEnabled]="
                  node.data.required === true &&
                  node.data.isFiltered === true &&
                  node.data.nodeClass === nodeClassFilter
                "
              >
                <button
                  *ngIf="node.data.isField === true"
                  type="button"
                  data-cy="filesTreeFilterButton"
                  class="group invisible flex h-10 flex-shrink-0 items-center justify-center rounded focus:outline-none [.group-bar:hover_&]:visible"
                  [ngClass]="{
                    'text-m600': node.data.isFiltered === true,
                    'text-s1': node.data.isFiltered === false
                  }"
                  [disabled]="
                    node.data.required === true &&
                    node.data.isFiltered === true &&
                    node.data.nodeClass === nodeClassFilter
                  "
                  (click)="filterField(node, $event)"
                >
                  <div
                    class="flex h-8 w-9 flex-shrink-0 flex-row items-center justify-center rounded"
                    [ngClass]="{
                      'group-hover:bg-m200':
                        node.data.required === false ||
                        node.data.isFiltered === false ||
                        node.data.nodeClass !== nodeClassFilter
                    }"
                  >
                    <m-filter-icon
                      [ngClass]="{
                        visible: node.data.isFiltered === true
                      }"
                    ></m-filter-icon>
                  </div>
                </button>
              </div> -->

                <div
                  *ngIf="node.data.isField === true"
                  class="invisible ml-3 flex [.group-bar:hover_&]:visible"
                >
                  <m-field-options
                    [modelNodeData]="node.data"
                    [isMetric]="false"
                  ></m-field-options>
                </div>
              </div>
            </div>
          </div>
        </ng-template>
      </tree-root>
    </ng-scrollbar>
  </div>
</div>

<div *ngIf="chart$ | async"></div>
<div *ngIf="nodesExtra$ | async"></div>
